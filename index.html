<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch QR Check-In / Out</title>
  <script src="https://unpkg.com" type="text/javascript"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 500px; margin: auto; padding: 16px; }
    #reader { width: 100%; margin-bottom: 12px; }
    select, input, button { width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
    button { background: #0066cc; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button.secondary { background: #555; }
    ul { list-style: none; padding: 0; }
    li { background: #f4f4f4; padding: 10px; margin: 4px 0; display: flex; justify-content: space-between; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Inventory QR Scanner</h2>
  <div id="reader"></div>

  <select id="action">
    <option value="Check In">Check In (+)</option>
    <option value="Check Out">Check Out (-)</option>
  </select>
  <input type="text" id="user" placeholder="Your Name or Location (Optional)" />

  <h3>Scanned Queue (<span id="count">0</span>)</h3>
  <ul id="queue"></ul>

  <button onclick="submitAll()">Submit All to Google Sheets</button>
  <button class="secondary" onclick="clearQueue()">Clear List</button>

  <script>
    const FORM_URL = "https://google.com";
    const ENTRY_ITEM = "entry.436807205";
    const ENTRY_ACTION = "entry.758189585";
    const ENTRY_USER = "entry.644931705";

    let scannedItems = [];
    let lastScanTime = 0;

    function onScanSuccess(decodedText) {
      const now = Date.now();
      // Prevent duplicate accidental reads within 1.5 seconds
      if (now - lastScanTime < 1500 && scannedItems[scannedItems.length - 1] === decodedText) return;
      lastScanTime = now;

      scannedItems.push(decodedText);
      if (navigator.vibrate) navigator.vibrate(100);
      renderQueue();
    }

    function renderQueue() {
      const list = document.getElementById("queue");
      list.innerHTML = "";
      scannedItems.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${item}</span><span style="color:red;cursor:pointer;" onclick="removeItem(${index})">✕</span>`;
        list.appendChild(li);
      });
      document.getElementById("count").innerText = scannedItems.length;
    }

    function removeItem(index) {
      scannedItems.splice(index, 1);
      renderQueue();
    }

    function clearQueue() {
      scannedItems = [];
      renderQueue();
    }

    async function submitAll() {
      if (scannedItems.length === 0) return alert("Scan at least one QR code first.");
      const action = document.getElementById("action").value;
      const user = document.getElementById("user").value || "N/A";

      for (const item of scannedItems) {
        const formData = new URLSearchParams();
        formData.append(ENTRY_ITEM, item);
        formData.append(ENTRY_ACTION, action);
        formData.append(ENTRY_USER, user);

        await fetch(FORM_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        });
      }

      alert(`Successfully logged ${scannedItems.length} items!`);
      clearQueue();
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    );
  </script>
</body>
</html>
